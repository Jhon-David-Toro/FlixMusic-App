    </radialGradient>
    <radialGradient id="dotGlow">
      <stop offset="0" stop-color="#A78BFA" stop-opacity=".75"/><stop offset=".45" stop-color="#7C3AED" stop-opacity=".3"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
