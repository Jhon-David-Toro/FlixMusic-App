    @keyframes halo { 0% { opacity: 0; transform: scale(.2); } 55% { opacity: 1; transform: scale(1.35); } 100% { opacity: .9; transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) { .letter, .dot, .glow { animation: none; opacity: 1; } }
